[workspace]
members = ["crates/eda-view", "crates/server", "crates/viewer", "crates/gds-viewer", "crates/sch-viewer", "crates/gerber-view"]
resolver = "2"

[workspace.package]
version = "1.12.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1.9"
log = "0.4"
eda-view = { version = "0.1.0", path = "crates/eda-view" }
sha2 = "0.10"
