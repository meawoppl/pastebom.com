[workspace]
members = ["crates/pcb-extract", "crates/server", "crates/viewer", "crates/gds-viewer", "crates/sch-viewer", "crates/vector-view-yew","crates/gerber-view", "crates/vector-view", "crates/kicad-schema", "crates/kicad-strokes", "crates/schematic-extract"]
resolver = "2"

[workspace.package]
version = "1.12.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1.9"
log = "0.4"
vector-view = { version = "0.1.0", path = "crates/vector-view" }
sha2 = "0.10"
