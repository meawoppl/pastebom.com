[package]
name = "kicad-strokes"
description = "KiCad text to stroke polylines (NewStroke font), so 2D viewers never need fonts"
version = "0.1.0"
repository = "https://github.com/meawoppl/pastebom.com"
readme = "README.md"
keywords = ["kicad", "schematic", "eda", "graphics"]
categories = ["graphics", "parsing"]
include = ["src/**", "README.md", "LICENSE*", "NOTICE.md", "docs/**", "examples/**", "tests/**"]
edition = "2021"
license = "MIT"

[dependencies]
vector-view = { package = "eda-view", path = "../eda-view" }

[dev-dependencies]
sha2 = { workspace = true }
