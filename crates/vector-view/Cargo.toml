[package]
name = "vector-view"
version = "0.1.0"
repository = "https://github.com/meawoppl/pastebom.com"
readme = "README.md"
keywords = ["kicad", "schematic", "eda", "graphics"]
categories = ["graphics", "parsing"]
include = ["src/**", "README.md", "LICENSE*", "NOTICE.md", "docs/**", "examples/**", "tests/**"]
edition = "2021"
license = "MIT"
description = "Reified 2D vector scenes (PCB, schematic, Gerber, footprint, symbol) and a minimal Canvas2D viewer core"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Canvas2D renderer (wasm32 / web-sys).
canvas = ["dep:web-sys", "dep:wasm-bindgen"]

[dependencies]
serde = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["CanvasRenderingContext2d", "CanvasWindingRule", "Document", "Element", "HtmlCanvasElement", "Node", "Path2d"] }

[dev-dependencies]
serde_json = { workspace = true }
