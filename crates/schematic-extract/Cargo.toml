[package]
name = "schematic-extract"
version = "0.1.0"
repository = "https://github.com/meawoppl/pastebom.com"
readme = "README.md"
keywords = ["kicad", "schematic", "eda", "graphics"]
categories = ["graphics", "parsing"]
include = ["src/**", "README.md", "LICENSE*", "NOTICE.md", "docs/**", "examples/**", "tests/**"]
edition = "2021"
license = "MIT"
description = "Filesystem-free KiCad schematic extraction into reusable layered vector scenes"

[dependencies]
anyhow = "1"
kicad-schema = { version = "0.1.0", path = "../kicad-schema" }
kicad-strokes = { version = "0.1.0", path = "../kicad-strokes" }
thiserror = "2"
vector-view = { package = "eda-view", path = "../eda-view" }

[dev-dependencies]
serde_json.workspace = true
