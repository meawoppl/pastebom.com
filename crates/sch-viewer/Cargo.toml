[package]
name = "sch-viewer"
version.workspace = true
edition = "2021"
description = "Interactive schematic viewer over vector-view scenes"

[dependencies]
gloo-events = "0.2"
gloo-net = "0.6"
js-sys = "0.3.106"
serde_json.workspace = true
vector-view = { workspace = true, features = ["canvas"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["CanvasRenderingContext2d", "DomRect", "Element", "HtmlCanvasElement", "HtmlInputElement", "HtmlSelectElement", "Location", "PointerEvent", "ResizeObserver", "UrlSearchParams", "WheelEvent", "Window", "History"] }
yew = { version = "0.21", features = ["csr"] }
